name: Import exact AOSP17 adb source (no security backports)

on:
  push:
    branches:
      - port/a17-adb-import-20261103
    paths:
      - .github/workflows/aosp17-adb-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aosp17-adb-import
  cancel-in-progress: false

jobs:
  import-aosp17-exact-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SOURCE_SHA: 9084198a2d4b0f6a0f174260fb42da33485b684d
      SOURCE_TREE: db70f52edb597631efbba79c00276bb68cb06831
      TARGET_BRANCH: port/a17-adb-aosp17-base-20261103
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch official AOSP17 release tag and verify commit plus Git tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aosp-adb"
          cd "$RUNNER_TEMP/aosp-adb"
          git init -q
          git remote add aosp https://android.googlesource.com/platform/packages/modules/adb
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none \
            aosp refs/tags/android-17.0.0_r1
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$SOURCE_TREE"
          git cat-file -e "$SOURCE_TREE^{tree}"
          echo "PASS: official AOSP17 adb commit $SOURCE_SHA and tree $SOURCE_TREE"

      - name: Publish isolated exact-tree snapshot without force-push
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aosp-adb"
          git remote add publish "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ref="refs/heads/$TARGET_BRANCH"
          existing="$(git ls-remote --heads publish "$ref" | cut -f1)"
          if [ -n "$existing" ]; then
            git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none publish "$ref"
            actual="$(git rev-parse 'FETCH_HEAD^{tree}')"
            test "$actual" = "$SOURCE_TREE" || {
              echo "Existing branch does not match official AOSP17 tree: $actual"
              exit 1
            }
            echo "PASS: pre-existing adb snapshot matches official tree"
            exit 0
          fi
          export GIT_AUTHOR_NAME="PixelExperience-Reborn CI"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          snapshot="$(printf 'adb: exact official AOSP17 r1 release snapshot\n\nOriginal AOSP commit: %s\nExact Git tree: %s\nFull Google ancestry intentionally not preserved.\nLegacy PE seventeen untouched; no recovery auth changes.\n' \
            "$SOURCE_SHA" "$SOURCE_TREE" | git commit-tree "$SOURCE_TREE")"
          test "$(git rev-parse "$snapshot^{tree}")" = "$SOURCE_TREE"
          git -c protocol.version=2 push --no-thin publish "$snapshot:$ref"
          published="$(git ls-remote --heads publish "$ref" | cut -f1)"
          test "$published" = "$snapshot"
          echo "PASS: adb source snapshot $snapshot has exact AOSP17 tree $SOURCE_TREE"
